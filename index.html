<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التوصيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-12 transition-colors duration-300" id="appBody">

    <!-- ================= واجهة البائع ================= -->
    <div id="sellerView" class="hidden">
        <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <span class="bg-indigo-900 p-2 rounded-xl text-xl">🏪</span>
                    <div>
                        <h1 class="text-lg font-extrabold">موقع البائع (الإدارة)</h1>
                        <p class="text-xs text-indigo-200" id="sellerSyncText">متصل بالسحابة تلقائياً 🟢</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="copyCourierLink()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition">
                        📲 نسخ رابط المندوب المعزول
                    </button>
                    <button onclick="changeStoreCode()" class="bg-indigo-800 hover:bg-indigo-900 text-xs px-3 py-2 rounded-xl border border-indigo-500">
                        🔑 كود المتجر: <span id="displayRoomCode" class="font-bold"></span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 mt-6">
            <!-- الإحصائيات -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-amber-500">
                    <p class="text-xs text-slate-500 font-bold">قيد الانتظار (عند المندوب)</p>
                    <p class="text-2xl font-extrabold text-amber-600 mt-1" id="statPending">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-emerald-500">
                    <p class="text-xs text-slate-500 font-bold">تم الإستلام</p>
                    <p class="text-2xl font-extrabold text-emerald-600 mt-1" id="statDelivered">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-rose-500">
                    <p class="text-xs text-slate-500 font-bold">رفض الإستلام</p>
                    <p class="text-2xl font-extrabold text-rose-600 mt-1" id="statRefused">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-indigo-600">
                    <p class="text-xs text-slate-500 font-bold">إجمالي المبالغ المحصلة</p>
                    <p class="text-2xl font-extrabold text-indigo-700 mt-1"><span id="statRevenue">0</span> د.م</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- نموذج إضافة مستلم -->
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 sticky top-24">
                        <h2 class="text-lg font-bold text-slate-800 mb-4">➕ إضافة مستلم جديد</h2>
                        <form id="orderForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">اسم المستلم *</label>
                                <input type="text" id="clientName" required placeholder="الاسم الكامل"
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">رقم الهاتف *</label>
                                <input type="tel" id="clientPhone" required placeholder="06XXXXXXXX" dir="ltr"
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-right">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">العنوان *</label>
                                <textarea id="clientAddress" required rows="2" placeholder="الحي، الشارع، رقم المنزل..."
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">الثمن (د.م) *</label>
                                <input type="number" id="orderPrice" required placeholder="150"
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <button type="submit" id="submitBtn"
                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition transform active:scale-95">
                                🚀 إرسال للمندوب أوتوماتيكياً
                            </button>
                        </form>
                    </div>
                </div>

                <!-- قائمة طلبات البائع -->
                <div class="lg:col-span-2">
                    <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                        <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                            <h2 class="text-lg font-bold text-slate-800">📋 متابعة حالة الطلبات</h2>
                            <div class="flex gap-2 text-xs">
                                <button onclick="setFilter('pending')" id="f-pending" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold">قيد الانتظار</button>
                                <button onclick="setFilter('delivered')" id="f-delivered" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-bold">تم الإستلام</button>
                                <button onclick="setFilter('refused')" id="f-refused" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-bold">رفض الإستلام</button>
                            </div>
                        </div>
                        <div id="sellerOrdersList" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= واجهة المندوب المعزولة ================= -->
    <div id="courierView" class="hidden">
        <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
            <div class="max-w-lg mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="bg-emerald-500/20 text-emerald-400 p-2 rounded-xl text-xl">🛵</span>
                    <div>
                        <h1 class="text-lg font-extrabold text-white">صفحة المندوب</h1>
                        <p class="text-xs text-emerald-400">تحديث تلقائي مباشر 🟢</p>
                    </div>
                </div>
                <span class="bg-amber-500 text-slate-950 font-extrabold text-sm px-3 py-1 rounded-full" id="pendingBadge">0 قيد الانتظار</span>
            </div>
        </header>

        <main class="max-w-lg mx-auto px-4 mt-6">
            <div id="courierOrdersList" class="space-y-4"></div>
        </main>
    </div>

    <script>
        // قراءة الرابط لمعرفة هل هذا موقع البائع أم موقع المندوب المعزول
        const urlParams = new URLSearchParams(window.location.search);
        const isCourier = urlParams.get('mode') === 'courier';
        
        // كود المتجر السحابي لضمان التزامن بين هاتفك وهاتف المندوب أوتوماتيكياً
        let roomCode = urlParams.get('store') || localStorage.getItem('SIMO_STORE_CODE') || 'simo_chop_tanger_01';
        localStorage.setItem('SIMO_STORE_CODE', roomCode);

        // قاعدة بيانات سحابية جاهزة ومجانية لا تحتاج أي تسجيل منك
        const CLOUD_API = `https://kvdb.io/A6Xy9kLp2mN8qR4vW1zB5c/orders_${roomCode}`;
        const LOCAL_KEY = `LOCAL_ORDERS_${roomCode}`;
        const channel = new BroadcastChannel('sync_' + roomCode);

        let orders = [];
        let currentFilter = 'pending';
        let openRefusalId = null;

        // تهيئة الشكل حسب نوع المستخدم (بائع أو مندوب)
        if (isCourier) {
            document.getElementById('appBody').className = 'min-h-screen pb-12 bg-slate-900 text-white';
            document.getElementById('courierView').classList.remove('hidden');
            document.title = 'تطبيق المندوب - الطلبات قيد الانتظار';
        } else {
            document.getElementById('appBody').className = 'min-h-screen pb-12 bg-slate-100 text-slate-900';
            document.getElementById('sellerView').classList.remove('hidden');
            document.getElementById('displayRoomCode').textContent = roomCode;
        }

        // جلب البيانات من السحابة أو المتصفح
        async function loadOrders() {
            if (isCourier && openRefusalId) return; // لا تقاطع المندوب أثناء كتابة سبب الرفض

            try {
                const res = await fetch(CLOUD_API, { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        orders = data;
                        localStorage.setItem(LOCAL_KEY, JSON.stringify(orders));
                    }
                } else {
                    orders = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
                }
            } catch (e) {
                orders = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
            }

            if (isCourier) {
                renderCourierOrders();
            } else {
                renderSellerOrders();
            }
        }

        // حفظ البيانات ومزامنتها فوراً مع الطرف الآخر
        async function saveOrders() {
            localStorage.setItem(LOCAL_KEY, JSON.stringify(orders));
            channel.postMessage('update');

            if (isCourier) {
                renderCourierOrders();
            } else {
                renderSellerOrders();
            }

            try {
                await fetch(CLOUD_API, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orders)
                });
            } catch (e) {
                console.warn('Cloud sync fallback to local');
            }
        }

        // إضافة مستلم جديد من موقع البائع
        const orderForm = document.getElementById('orderForm');
        if (orderForm) {
            orderForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.textContent = '⏳ جاري الإرسال للمندوب...';
                btn.disabled = true;

                const newOrder = {
                    id: 'ORD_' + Date.now(),
                    name: document.getElementById('clientName').value.trim(),
                    phone: document.getElementById('clientPhone').value.trim(),
                    address: document.getElementById('clientAddress').value.trim(),
                    price: parseFloat(document.getElementById('orderPrice').value) || 0,
                    status: 'pending',
                    refusalReason: '',
                    createdAt: Date.now()
                };

                orders.unshift(newOrder);
                orderForm.reset();
                await saveOrders();

                btn.textContent = '✅ تم الإرسال للمندوب!';
                setTimeout(() => {
                    btn.textContent = '🚀 إرسال للمندوب أوتوماتيكياً';
                    btn.disabled = false;
                }, 1200);
            });
        }

        // وظائف البائع
        function setFilter(f) {
            currentFilter = f;
            ['pending', 'delivered', 'refused'].forEach(k => {
                const btn = document.getElementById('f-' + k);
                if (btn) {
                    btn.className = (k === f)
                        ? 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold'
                        : 'px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-bold';
                }
            });
            renderSellerOrders();
        }

        async function deleteOrder(id) {
            if (!confirm('حذف هذا المستلم نهائياً؟')) return;
            orders = orders.filter(o => o.id !== id);
            await saveOrders();
        }

        function copyCourierLink() {
            const baseUrl = window.location.origin + window.location.pathname;
            const courierLink = `${baseUrl}?mode=courier&store=${encodeURIComponent(roomCode)}`;
            navigator.clipboard.writeText(courierLink).then(() => {
                alert('تم نسخ رابط المندوب المعزول بنجاح!\nأرسله للمندوب عبر الواتساب:\n\n' + courierLink);
            }).catch(() => {
                prompt('انسخ هذا الرابط وأرسله للمندوب:', courierLink);
            });
        }

        function changeStoreCode() {
            const newCode = prompt('أدخل كود خاص بمتجرك (حروف وأرقام إنجليزية بدون مسافات):', roomCode);
            if (newCode && newCode.trim()) {
                roomCode = newCode.trim().replace(/\s+/g, '_');
                localStorage.setItem('SIMO_STORE_CODE', roomCode);
                window.location.search = `?store=${encodeURIComponent(roomCode)}`;
            }
        }

        function renderSellerOrders() {
            const pendingCount = orders.filter(o => o.status === 'pending').length;
            const deliveredOrders = orders.filter(o => o.status === 'delivered');
            const refusedCount = orders.filter(o => o.status === 'refused').length;
            const revenue = deliveredOrders.reduce((sum, o) => sum + Number(o.price), 0);

            document.getElementById('statPending').textContent = pendingCount;
            document.getElementById('statDelivered').textContent = deliveredOrders.length;
            document.getElementById('statRefused').textContent = refusedCount;
            document.getElementById('statRevenue').textContent = revenue.toLocaleString();

            const container = document.getElementById('sellerOrdersList');
            const filtered = orders.filter(o => o.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">لا توجد طلبات في هذا القسم حالياً</div>`;
                return;
            }

            container.innerHTML = filtered.map(order => {
                let badge = '';
                if (order.status === 'pending') {
                    badge = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">⏳ قيد الانتظار</span>`;
                } else if (order.status === 'delivered') {
                    badge = `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">✅ تم الإستلام</span>`;
                } else if (order.status === 'refused') {
                    badge = `<span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full">❌ رفض الإستلام</span>`;
                }

                return `
                <div class="border border-slate-200 rounded-xl p-4 bg-slate-50/60">
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">${order.name}</h3>
                            <p class="text-xs text-slate-600 mt-0.5">📍 ${order.address}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${badge}
                            <button onclick="deleteOrder('${order.id}')" class="text-slate-400 hover:text-rose-600 text-sm px-1">🗑️</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-200">
                        <a href="tel:${order.phone}" class="text-sm font-bold text-indigo-600 hover:underline" dir="ltr">📞 ${order.phone}</a>
                        <span class="font-extrabold text-slate-800 bg-white px-3 py-1 rounded-lg border text-sm">${order.price} د.م</span>
                    </div>
                    ${order.status === 'refused' && order.refusalReason ? `
                        <div class="mt-3 bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-xs text-rose-800">
                            <strong>السبب:</strong> ${order.refusalReason}
                        </div>
                    ` : ''}
                </div>`;
            }).join('');
        }

        // وظائف المندوب (يظهر له فقط قيد الانتظار، ويختفي الطلب فور الضغط)
        async function markDelivered(id) {
            const idx = orders.findIndex(o => o.id === id);
            if (idx !== -1) {
                orders[idx].status = 'delivered';
                openRefusalId = null;
                await saveOrders();
            }
        }

        function showRefusalBox(id) {
            openRefusalId = id;
            const box = document.getElementById('refusal-box-' + id);
            if (box) {
                box.classList.remove('hidden');
                document.getElementById('reason-input-' + id).focus();
            }
        }

        function cancelRefusalBox(id) {
            openRefusalId = null;
            const box = document.getElementById('refusal-box-' + id);
            if (box) box.classList.add('hidden');
        }

        async function confirmRefusal(id) {
            const input = document.getElementById('reason-input-' + id);
            const reason = input ? input.value.trim() : '';
            if (!reason) {
                alert('المرجو كتابة السبب أولاً');
                return;
            }
            const idx = orders.findIndex(o => o.id === id);
            if (idx !== -1) {
                orders[idx].status = 'refused';
                orders[idx].refusalReason = reason;
                openRefusalId = null;
                await saveOrders();
            }
        }

        function renderCourierOrders() {
            const pendingOrders = orders.filter(o => o.status === 'pending');
            document.getElementById('pendingBadge').textContent = `${pendingOrders.length} قيد الانتظار`;

            const container = document.getElementById('courierOrdersList');

            if (pendingOrders.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-10 text-center mt-8">
                        <div class="text-5xl mb-3">📦</div>
                        <h2 class="text-lg font-bold text-white">لا توجد طلبات قيد الانتظار</h2>
                        <p class="text-xs text-slate-400 mt-1">سيظهر أي مستلم جديد هنا أوتوماتيكياً فور إضافته من البائع.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = pendingOrders.map(order => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
                    <div class="flex justify-between items-start gap-2 mb-3">
                        <div>
                            <span class="text-xs text-amber-400 font-bold">⏳ قيد الانتظار</span>
                            <h3 class="text-xl font-extrabold text-white mt-0.5">${order.name}</h3>
                        </div>
                        <div class="bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 font-extrabold px-3 py-1.5 rounded-xl text-base">
                            ${order.price} د.م
                        </div>
                    </div>

                    <div class="bg-slate-900/80 rounded-xl p-3 mb-4 border border-slate-700">
                        <p class="text-sm text-slate-200">📍 <strong>العنوان:</strong> ${order.address}</p>
                    </div>

                    <a href="tel:${order.phone}"
                        class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition flex items-center justify-center gap-2 text-white font-bold py-3 px-4 rounded-xl shadow mb-4 text-base" dir="ltr">
                        <span>📞</span>
                        <span>${order.phone}</span>
                        <span class="text-xs bg-blue-800 px-2 py-0.5 rounded text-blue-100 mr-auto" dir="rtl">اضغط للاتصال</span>
                    </a>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="markDelivered('${order.id}')"
                            class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white font-bold py-3 rounded-xl shadow">
                            ✅ تم الإستلام
                        </button>
                        <button onclick="showRefusalBox('${order.id}')"
                            class="bg-rose-600 hover:bg-rose-500 active:scale-95 transition text-white font-bold py-3 rounded-xl shadow">
                            ❌ رفض الإستلام
                        </button>
                    </div>

                    <div id="refusal-box-${order.id}" class="hidden mt-4 pt-4 border-t border-slate-700">
                        <label class="block text-xs font-bold text-rose-400 mb-2">السبب:</label>
                        <input type="text" id="reason-input-${order.id}" placeholder="السبب"
                            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-rose-500 text-white text-sm focus:outline-none mb-3">
                        <div class="flex gap-2">
                            <button onclick="confirmRefusal('${order.id}')"
                                class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 rounded-xl text-sm">
                                تأكيد الرفض
                            </button>
                            <button onclick="cancelRefusalBox('${order.id}')"
                                class="px-4 bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-sm">
                                إلغاء
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // تحديث أوتوماتيكي كل ثانيتين بين هاتف البائع وهاتف المندوب
        channel.onmessage = () => loadOrders();
        window.addEventListener('storage', () => loadOrders());
        setInterval(loadOrders, 2500);
        loadOrders();
    </script>
</body>
</html>
